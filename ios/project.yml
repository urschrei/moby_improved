name: MyMoby
options:
  bundleIdPrefix: ie.urschrei
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  MobyKit:
    path: MobyKit
targets:
  MyMoby:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: MyMoby
      - path: Shared
      - path: ../core/tests/fixtures/probe
        type: folder
        buildPhase: resources
    dependencies:
      - package: MobyKit
      - target: MyMobyWidgets
    info:
      path: MyMoby/Info.plist
      properties:
        CFBundleDisplayName: MyMoby
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: MyMoby uses your location to find the nearest bikes.
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [mymoby]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOBY_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  MyMobyWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: MyMobyWidgets
      - path: Shared
    info:
      path: MyMobyWidgets/Info.plist
      properties:
        CFBundleDisplayName: MyMoby
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOBY_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
