[workspace]
resolver = "3"
members = ["core"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
self_named_module_files = "warn"
wildcard_enum_match_arm = "warn"
