[workspace]
resolver = "3"
members = ["core", "ffi"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "BlueOak-1.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
self_named_module_files = "warn"
wildcard_enum_match_arm = "warn"

[profile.release]
lto = true
codegen-units = 1
