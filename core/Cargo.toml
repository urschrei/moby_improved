[package]
name = "moby-core"
version = "0.1.0"
description = "GBFS client logic for MOBY Dublin: parsing, filtering and ranking of available bikes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rstar = "0.13"
rstar_geodetic = { git = "https://github.com/urschrei/rstar_geodetic", rev = "02b71a2f2cc3baeb49a5330196248d7c9f49a03d" }
geo = "0.33"
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: zone hashes depend on the text of parsed floats; see
# `gbfs::ZoneHash::of`.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"
blake3 = "1"

[lints]
workspace = true

[dev-dependencies]
hegeltest = "0.48.1"
jsonschema = { version = "0.58.0", default-features = false }
