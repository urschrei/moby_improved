[package]
name = "moby-core"
version = "0.1.0"
description = "GBFS client logic for MOBY Dublin: parsing, filtering and ranking of available bikes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
hegeltest = "0.47.4"
jsonschema = { version = "0.58.0", default-features = false }
